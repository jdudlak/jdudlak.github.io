<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Virtual Keyboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Bangers&display=swap');

body {
    margin: 0;
    padding: 0;
    font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
    background-color: #2a2a2a;
    overflow-x: hidden;
    transition: background-color 0.3s ease;
}

h1 {
    text-align: center;
    color: #ffffff;
    margin-top: 30px;
    font-size: 3.5rem;
    font-family: 'Bangers', cursive;
    letter-spacing: 3px;
    text-shadow: 4px 4px 0px #ff00ff, 8px 8px 0px #00ffff;
    transform: rotate(-2deg);
}

.keyboard-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    margin: 40px auto;
    max-width: 900px;
    padding: 20px;
}

.keyboard-row {
    display: flex;
    gap: 8px;
    justify-content: center;
}

.key {
    min-width: 60px;
    height: 60px;
    padding: 8px;
    background: linear-gradient(145deg, #ffffff 0%, #ffd6f7 50%, #c4e0ff 100%);
    border: 4px solid #fff;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    font-weight: 700;
    font-size: 1.1rem;
    cursor: pointer;
    user-select: none;
    position: relative;
    box-shadow: 0 8px 0 #8855cc, 0 12px 20px rgba(0,0,0,0.4);
    transition: all 0.15s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    color: #333;
    transform: translateY(0) rotate(0deg);
}

.key:hover {
    transform: translateY(-4px) rotate(-2deg) scale(1.05);
    box-shadow: 0 12px 0 #aa66ff, 0 16px 25px rgba(0,0,0,0.5);
    background: linear-gradient(145deg, #ffffff 0%, #ffe6f9 50%, #d4f0ff 100%);
}

.key.active {
    transform: translateY(8px) rotate(1deg) scale(0.98);
    box-shadow: 0 2px 0 #663399, 0 4px 10px rgba(0,0,0,0.3);
    background: linear-gradient(145deg, #ffeb3b 0%, #ff9800 50%, #ff5722 100%);
    color: white;
    border-color: #ffeb3b;
    animation: wiggle 0.3s ease-in-out;
}

@keyframes wiggle {
    0%, 100% { transform: translateY(8px) rotate(0deg); }
    25% { transform: translateY(8px) rotate(-3deg); }
    75% { transform: translateY(8px) rotate(3deg); }
}

.key-letter {
    font-size: 1.4rem;
    font-weight: 700;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
}

.key-note {
    font-size: 0.75rem;
    color: #9c27b0;
    font-weight: 600;
    background: rgba(255,255,255,0.7);
    padding: 2px 6px;
    border-radius: 10px;
    text-shadow: none;
}

.key.active .key-note {
    color: #fff;
    background: rgba(0,0,0,0.3);
    font-weight: 700;
}

.controls {
    text-align: center;
    margin: 30px 0;
    font-size: 1.2rem;
    color: #fff;
    font-weight: 600;
}

.controls label {
    margin: 0 10px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
}

.controls select {
    padding: 8px 15px;
    font-size: 1rem;
    font-family: 'Fredoka', cursive;
    font-weight: 600;
    border-radius: 15px;
    border: 3px solid #ff00ff;
    background: linear-gradient(145deg, #ffffff, #ffe6f9);
    cursor: pointer;
    box-shadow: 0 4px 0 #cc00cc, 0 6px 15px rgba(0,0,0,0.3);
    transition: all 0.2s ease;
}

.controls select:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 0 #cc00cc, 0 8px 20px rgba(0,0,0,0.4);
}

.controls select:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #cc00cc, 0 3px 10px rgba(0,0,0,0.3);
}

</style>

</head>

<body>
